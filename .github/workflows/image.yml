name: Build, test, and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ESPOCRM_VERSION: "9.3.8"

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: bash -n scripts/smoke-test.sh

      - name: Check out upstream release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: espocrm/espocrm-docker
          ref: refs/tags/${{ env.ESPOCRM_VERSION }}
          path: upstream
          persist-credentials: false

      - name: Patch only the PHP base
        id: config
        shell: bash
        run: |
          base_image=$(sed -n 's/^+FROM //p' patches/php-base.patch)
          if [[ ! "$base_image" =~ ^php:([0-9]+\.[0-9]+\.[0-9]+)-apache-trixie$ ]]; then
            echo "Unexpected PHP base in patch: $base_image" >&2
            exit 1
          fi
          php_version=${BASH_REMATCH[1]}
          git -C upstream apply --unidiff-zero "$GITHUB_WORKSPACE/patches/php-base.patch"
          upstream_revision=$(git -C upstream rev-parse HEAD)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$ESPOCRM_VERSION-php$php_version"
          {
            echo "base=$base_image"
            echo "php_version=$php_version"
            echo "upstream_revision=$upstream_revision"
            echo "image=$image"
            echo "version=$version"
            echo "build_version=$version-build.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          printf 'Upstream tag: `%s`\n\nCommit: `%s`\n\nPHP base: `%s`\n\n' \
            "$ESPOCRM_VERSION" "$upstream_revision" "$base_image" >> "$GITHUB_STEP_SUMMARY"

      - name: Build upstream Apache image
        env:
          BASE: ${{ steps.config.outputs.base }}
          VERSION: ${{ steps.config.outputs.version }}
          UPSTREAM_REVISION: ${{ steps.config.outputs.upstream_revision }}
        run: |
          docker build --pull --platform linux/amd64 --tag espocrm-php-patched:test \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.description=Unofficial EspoCRM rebuild with patched PHP." \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.base.name=$BASE" \
            --label "io.github.espocrm-php-patched.upstream-revision=$UPSTREAM_REVISION" \
            ./upstream/latest/apache

      - name: Test PHP CLI, extensions, and Apache
        env:
          EXPECTED_PHP_VERSION: ${{ steps.config.outputs.php_version }}
        run: bash scripts/smoke-test.sh espocrm-php-patched:test "$EXPECTED_PHP_VERSION"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image without rebuilding
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          VERSION: ${{ steps.config.outputs.version }}
          BUILD_VERSION: ${{ steps.config.outputs.build_version }}
        run: |
          docker tag espocrm-php-patched:test "$IMAGE:$BUILD_VERSION"
          docker push "$IMAGE:$BUILD_VERSION"
          docker tag espocrm-php-patched:test "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          digest_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          {
            printf '\nImage: `%s:%s`\n' "$IMAGE" "$VERSION"
            printf '\nBuild tag: `%s:%s`\n' "$IMAGE" "$BUILD_VERSION"
            printf '\nProduction digest: `%s`\n' "$digest_ref"
          } >> "$GITHUB_STEP_SUMMARY"
